# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ocr.lipana.co;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name ocr.lipana.co;

    # SSL certificate paths (adjust if your cert location differs)
    ssl_certificate /etc/letsencrypt/live/ocr.lipana.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.lipana.co/privkey.pem;

    # SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow uploads up to 20MB (service accepts 10MB files)
    client_max_body_size 20M;

    access_log /var/log/nginx/ocr.lipana.co.access.log;
    error_log /var/log/nginx/ocr.lipana.co.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Optional static files served from project (adjust path if different)
    location /static/ {
        alias /home/ocr-service/ui/static/;
    }
}
