server {
    listen 80;
    server_name ocr.lipana.co;

    # Allow uploads up to 20MB (service accepts 10MB files)
    client_max_body_size 20M;

    access_log /var/log/nginx/ocr.lipana.co.access.log;
    error_log /var/log/nginx/ocr.lipana.co.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Optional static files served from project (adjust path if different)
    location /static/ {
        alias /home/ocr-service/ui/static/;
    }
}
